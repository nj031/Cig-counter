# This file tells Gradle where the Android SDK is installed.
# It is machine-specific — set this to your actual SDK path before building.
#
# Examples:
#   macOS/Linux: sdk.dir=/Users/<you>/Library/Android/sdk
#   Windows:     sdk.dir=C\:\\Users\\<you>\\AppData\\Local\\Android\\Sdk
sdk.dir=/path/to/android/sdk
